<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Find My Block · Campus Navigation</title><meta name="description" content="Plan routes along Burnside High School's marked campus walkways with a forward-facing navigation view."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Cpath d='M16 5 26 26 16 21 6 26Z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head>
<body>
<main id="app">
<div id="map" aria-label="Campus navigation map"><div id="world"><img src="campus-map.jpeg" width="1536" height="1086" alt="Burnside High School campus map"><svg viewBox="0 0 1536 1086" aria-label="Routes drawn along the marked walkways"><g id="network"></g><polyline id="halo" pathLength="1"/><polyline id="route" pathLength="1"/><g id="destination"><circle r="15" fill="#ea4335" stroke="white" stroke-width="5"/></g><g id="position"><circle r="24" fill="#1a73e8" opacity=".16"/><path d="M0 -18 13 14 0 8 -13 14Z" fill="#1a73e8" stroke="white" stroke-width="4"/></g></svg></div></div>
<header class="planner">
<div class="brand"><b>Find My Block</b><span>BURNSIDE</span><button id="language" aria-label="Switch language">中文</button></div>
<div class="fields"><div class="selects"><label><i class="start-dot"></i><select id="from" aria-label="Starting point"></select></label><label><i class="end-dot"></i><select id="to" aria-label="Destination"></select></label></div><button id="swap" aria-label="Swap start and destination">⇅</button></div>
</header>
<section id="guidance" class="guidance" aria-live="polite"><span id="turnIcon">↑</span><div><strong id="instruction"></strong><span id="next"></span></div></section>
<div class="map-actions"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="overview" aria-label="Show route overview">⊞</button><button id="follow" aria-label="Follow travel direction">➤</button></div>
<span class="demo-badge" id="badge">Route preview · Location off</span>
<section class="bottom" id="bottomCard">
<div class="trip"><div><h1 id="tripTitle"></h1><p id="tripSubtitle"></p></div><span class="walk" aria-hidden="true">↗</span></div>
<div id="progressWrap" hidden><label id="progressLabel" for="progress"></label><input id="progress" type="range" min="0" max="1000" value="0" aria-label="Simulated route progress"></div>
<div class="buttons"><button id="start" class="primary"></button><button id="reset" class="secondary"></button></div>
<p id="note" class="note"></p>
</section>
<div class="map-credit">Burnside High School · Campus map</div>
</main>
</body></html>
