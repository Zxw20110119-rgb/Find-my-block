<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Google sign-in · Find My Block</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#edf4ed;color:#1d3027;font:16px/1.55 system-ui;padding:24px}main{width:100%;max-width:400px;padding:32px;background:white;border-radius:28px;box-shadow:0 16px 48px #173a1f16}.mark{font-size:28px;color:#1a73e8}h1{font-size:25px;line-height:1.2;margin:16px 0 12px}p{color:#58665e}button{width:100%;padding:13px 20px;border:0;border-radius:18px;background:#1a73e8;color:white;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.5}#google{margin:20px 0;min-height:44px}#status{font-size:14px;min-height:44px}.small{font-size:13px}a{color:#1765c1}</style></head>
<body><main><div class="mark" aria-hidden="true">➤</div><h1 id="title">Connect your Google account</h1><p id="intro">Sign in to save your timetable and load it on GitHub Pages.</p><p id="identity" hidden></p><button id="continue" type="button" hidden>Continue</button><div id="google"></div><p id="status" role="status">Preparing sign-in…</p><p id="help" class="small">Your timetable is shared with the main Find My Block site.</p><a id="privacy" href="/privacy.html" target="_blank" rel="noopener">Privacy and data</a></main>
<script>
(function(){
  const allowedOrigin='https://zxw20110119-rgb.github.io';
  const params=new URLSearchParams(location.search),parentOrigin=params.get('origin'),state=params.get('state');
  const zh=params.get('lang')==='zh';document.documentElement.lang=zh?'zh':'en';
  const el=id=>document.getElementById(id),t=(a,b)=>zh?a:b;
  el('title').textContent=t('连接 Google 账号','Connect your Google account');
  el('intro').textContent=t('登录后，将课表保存到账号并在 GitHub 版读取。','Sign in to save your timetable and load it on GitHub Pages.');
  el('help').textContent=t('你的账号课表与 Find My Block 主站共用。','Your timetable is shared with the main Find My Block site.');
  el('privacy').textContent=t('隐私与数据','Privacy and data');
  const show=message=>el('status').textContent=message;
  let csrf='',busy=false;
  if(parentOrigin!==allowedOrigin||!state||!/^[a-f0-9]{48}$/.test(state)||!window.opener){show(t('请返回 GitHub 网站，点击“使用 Google 登录”。','Return to GitHub Pages and choose Sign in with Google.'));return;}
  async function api(path,options={}){
    const response=await fetch(path,{...options,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf}});
    const data=await response.json();if(!response.ok)throw new Error(data.error||'Sign-in failed.');return data;
  }
  async function connect(){
    if(busy)return;busy=true;el('continue').disabled=true;show(t('正在连接账号…','Connecting your account…'));
    try{
      const session=await api('/api/account/pages-session',{method:'POST',body:JSON.stringify({origin:parentOrigin})});
      window.opener.postMessage({type:'find-my-block:account',state,accessToken:session.accessToken,expiresAt:session.expiresAt},parentOrigin);
      show(t('已连接，可以返回 GitHub 网站。','Connected. You can return to GitHub Pages.'));
    }catch(error){busy=false;el('continue').disabled=false;show(t('连接失败，请重试。','Could not connect. Please try again.'));}
  }
  async function start(){
    try{
      const account=await api('/api/account');csrf=account.csrf;
      if(!account.googleClientId){show(t('网站作者尚未配置 Google 登录。','The site owner has not configured Google sign-in.'));return;}
      if(account.user){
        el('identity').hidden=false;el('identity').textContent=account.user.email;
        el('continue').hidden=false;el('continue').textContent=t('继续使用此账号','Continue with this account');el('continue').onclick=connect;
        show(t('继续使用上方账号，或在下方选择其他 Google 账号。','Continue with the account above, or choose another Google account below.'));
      }else show(t('请选择 Google 账号。','Choose your Google account.'));
      const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;
      script.onerror=()=>show(t('无法加载 Google 登录，请刷新重试。','Could not load Google sign-in. Refresh and try again.'));
      script.onload=()=>{
        google.accounts.id.initialize({client_id:account.googleClientId,nonce:csrf,ux_mode:'popup',auto_select:false,callback:async result=>{
          try{
            const signed=await api('/api/account/google',{method:'POST',body:JSON.stringify({credential:result.credential,csrf})});csrf=signed.csrf;await connect();
          }catch{show(t('Google 登录失败，请重试。','Google sign-in failed. Please try again.'));}
        }});
        google.accounts.id.renderButton(el('google'),{type:'standard',theme:'outline',size:'large',shape:'pill',text:'signin_with'});
      };
      document.head.append(script);
    }catch{show(t('暂时无法连接账号服务，请刷新重试。','Could not reach the account service. Refresh and try again.'));}
  }
  start();
})();
</script></body></html>
